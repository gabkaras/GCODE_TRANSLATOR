name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[test,step,slicer]
      - run: pytest -q
      - name: smoke-test CLI
        run: gcode2krl examples/fillet_rect.nc -o out --tol 0.05
